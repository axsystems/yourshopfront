<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" aria-hidden="true">
  <title>Your Shopfront — default OG image</title>
  <!--
    1200x630 OG fallback. Your Shopfront chrome aesthetic — paper background, text-only ink
    wordmark in upper-left (the site's live header/footer carry no graphic mark — see
    src/components/apex/logo.tsx — so this image doesn't invent one either), oversized
    "Websites that book more jobs." headline with sunshine underline beneath "book",
    coral mono caption below, cobalt rule along the bottom edge.
  -->
  <rect width="1200" height="630" fill="#FFFFFF" />

  <!-- top-left wordmark, baseline aligned so its cap-height sits on the same 72px inset
       used by the headline and caption below. -->
  <text x="72" y="120" fill="#111418" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.02em">Your Shopfront</text>

  <!-- Headline. Two lines. -->
  <text x="72" y="320" fill="#111418" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-0.025em">Websites that</text>
  <text x="72" y="430" fill="#111418" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-0.025em">book more jobs.</text>

  <!-- Sunshine underline beneath "book" — hand-drawn-feel slightly wobbly path. -->
  <path d="M 72 446 C 130 438, 200 444, 234 442 L 234 458 C 200 460, 130 454, 72 462 Z" fill="#FFE34D" />

  <!-- Coral mono caption -->
  <text x="72" y="510" fill="#FF5B47" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="600" letter-spacing="0.04em">$99 SETUP + $99/MO &#215; 3 MOS &#183; THEN $149/MO &#183; LIVE IN 24H</text>

  <!-- Cobalt bottom rule -->
  <rect x="0" y="618" width="1200" height="12" fill="#2438FF" />
</svg>
